description:
  human:
    en_US: Search the web and get extracted, answer-ready page content instead of
      a list of links.
    zh_Hans: 搜索网页并直接获得已提取、可用于回答的页面内容，而不是一串链接。
  llm: Search the web through SERPdive. Returns extracted, answer-ready content
    from live pages, best sources first. Use it for real-time information, facts,
    news, and anything outside your training data. The query's language decides
    where the search runs.
extra:
  python:
    source: tools/serpdive_search.py
identity:
  author: serpdive
  label:
    en_US: SERPdive Search
    zh_Hans: SERPdive 搜索
  name: serpdive_search
parameters:
- name: query
  form: llm
  human_description:
    en_US: The search query, as you would ask it. Maximum 300 characters.
    zh_Hans: 您的搜索查询，像平常提问一样表述。最多 300 个字符。
  label:
    en_US: Query
    zh_Hans: 查询
  llm_description: The search query, phrased as a plain natural-language question
    or topic. Maximum 300 characters. The query's language decides where the
    search runs.
  required: true
  type: string
- name: model
  default: mako
  # The agent picks, as it does with any tool parameter — it is the one that
  # knows whether this particular search needs a whole page or a few sentences.
  # What it must NOT be told is the price: an agent handed "free and unlimited"
  # routes everything there, which is a billing decision made by something that
  # has no business making it. `llm_description` therefore describes CAPABILITY
  # only — what each depth returns and what it costs in latency and size — and
  # says plainly that mako is the default and the right answer nearly always.
  # The credit cost lives in `human_description`, for the person who configures
  # the tool and is the one actually arbitrating a budget.
  form: llm
  human_description:
    en_US: Retrieval depth, and what it costs. Mako is fast and returns the
      fact-carrying sentences of each source (1 credit). Krill is the free tier,
      unlimited under fair use — the smallest useful payload, one request at a
      time, at low priority, with no written answer (0 credits). Moby returns
      the full readable content of every page and takes longer (1.5 credits).
    zh_Hans: 检索深度及其费用。Mako 速度快，返回每个来源中承载事实的句子（1 积分）。Krill
      是免费套餐，在合理使用范围内无限制——最小可用返回、单次并发、低优先级、不含书面答案（0
      积分）。Moby 返回每个页面的完整可读内容，耗时更长（1.5 积分）。
  label:
    en_US: Model
    zh_Hans: 模型
  llm_description: Retrieval depth. Leave this unset unless there is a specific
    reason not to. 'mako' is the default and the right choice for nearly every
    search - fast, and it returns the fact-carrying sentences of each source,
    which is what answering a question needs. 'moby' returns the full readable
    text of every page instead of selected sentences; it is substantially slower
    and many times larger, so choose it only when whole-page context is genuinely
    required, such as reading a document rather than answering about it. 'krill'
    returns a shallower extraction than mako, with no written answer and one
    request at a time; it is the lightest and the least complete of the three,
    so choose it only when a minimal payload matters more than the quality of
    the answer.
  options:
  - label:
      en_US: Mako (fast, lean)
      zh_Hans: Mako（快速、精简）
    value: mako
  - label:
      en_US: Krill (free, unlimited)
      zh_Hans: Krill（免费、无限制）
    value: krill
  - label:
      en_US: Moby (full pages)
      zh_Hans: Moby（完整页面）
    value: moby
  required: false
  type: select
- name: answer
  default: false
  form: form
  human_description:
    en_US: Also return a written answer built from the sources, concise with Mako,
      detailed with citations with Moby. Included in the price, no extra credits.
    zh_Hans: 同时返回根据来源撰写的答案，Mako 简洁，Moby 详细并带引用。已包含在价格中，不消耗额外积分。
  label:
    en_US: Include Answer
    zh_Hans: 包含答案
  llm_description: When set to true, also returns a written answer built from the
    sources. Concise with 'mako', detailed with numbered citations with 'moby'.
  required: false
  type: boolean
- name: max_results
  form: llm
  human_description:
    en_US: A hard cap on how many results come back, keeping the best-ranked ones
      (1 to 10). Leave empty to get everything relevant.
    zh_Hans: 返回结果数量的上限，保留排名最佳的结果（1 到 10）。留空则返回所有相关内容。
  label:
    en_US: Max Results
    zh_Hans: 最大结果数
  llm_description: A hard cap on how many results come back, keeping the
    best-ranked ones. Between 1 and 10. Trims the response but does not speed up
    the search. Omit to get everything the engine considers relevant.
  max: 10
  min: 1
  required: false
  type: number
